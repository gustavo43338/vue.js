<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E0F6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#skyGradient)"/>

  <!-- Clouds -->
  <circle cx="150" cy="100" r="40" fill="rgba(255,255,255,0.7)"/>
  <circle cx="200" cy="90" r="50" fill="rgba(255,255,255,0.6)"/>
  <circle cx="100" cy="110" r="35" fill="rgba(255,255,255,0.65)"/>
  
  <circle cx="900" cy="120" r="45" fill="rgba(255,255,255,0.7)"/>
  <circle cx="960" cy="100" r="55" fill="rgba(255,255,255,0.6)"/>
  <circle cx="850" cy="130" r="40" fill="rgba(255,255,255,0.65)"/>

  <!-- Sun -->
  <circle cx="1000" cy="80" r="35" fill="#FFD700" opacity="0.8"/>

  <!-- Ground/Grass -->
  <rect y="650" width="1200" height="150" fill="#2D5016"/>
  <rect y="600" width="1200" height="50" fill="#3A6B1F"/>

  <!-- Main building (center-left) -->
  <g id="main-building">
    <!-- Building base -->
    <rect x="200" y="350" width="280" height="250" fill="url(#buildingGradient)" stroke="#999" stroke-width="2"/>
    
    <!-- Windows rows (4x5) -->
    <g id="windows" stroke="#333" stroke-width="1.5" fill="#87CEEB">
      <!-- Row 1 -->
      <rect x="220" y="370" width="35" height="35" rx="2"/>
      <rect x="275" y="370" width="35" height="35" rx="2"/>
      <rect x="330" y="370" width="35" height="35" rx="2"/>
      <rect x="385" y="370" width="35" height="35" rx="2"/>
      
      <!-- Row 2 -->
      <rect x="220" y="425" width="35" height="35" rx="2"/>
      <rect x="275" y="425" width="35" height="35" rx="2"/>
      <rect x="330" y="425" width="35" height="35" rx="2"/>
      <rect x="385" y="425" width="35" height="35" rx="2"/>
      
      <!-- Row 3 -->
      <rect x="220" y="480" width="35" height="35" rx="2"/>
      <rect x="275" y="480" width="35" height="35" rx="2"/>
      <rect x="330" y="480" width="35" height="35" rx="2"/>
      <rect x="385" y="480" width="35" height="35" rx="2"/>
      
      <!-- Row 4 -->
      <rect x="220" y="535" width="35" height="35" rx="2"/>
      <rect x="275" y="535" width="35" height="35" rx="2"/>
      <rect x="330" y="535" width="35" height="35" rx="2"/>
      <rect x="385" y="535" width="35" height="35" rx="2"/>
    </g>

    <!-- Door -->
    <rect x="310" y="530" width="50" height="70" fill="#8B4513" stroke="#654321" stroke-width="2" rx="3"/>
    <circle cx="355" cy="565" r="4" fill="#FFD700"/>

    <!-- Roof -->
    <polygon points="200,350 340,280 480,350" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
  </g>

  <!-- Right building (taller) -->
  <g id="right-building">
    <!-- Building base -->
    <rect x="600" y="280" width="260" height="320" fill="#F0F0F0" stroke="#999" stroke-width="2"/>
    
    <!-- Windows -->
    <g stroke="#333" stroke-width="1.5" fill="#87CEEB">
      <!-- Row 1 -->
      <rect x="620" y="300" width="32" height="32" rx="2"/>
      <rect x="670" y="300" width="32" height="32" rx="2"/>
      <rect x="720" y="300" width="32" height="32" rx="2"/>
      <rect x="770" y="300" width="32" height="32" rx="2"/>
      
      <!-- Row 2 -->
      <rect x="620" y="355" width="32" height="32" rx="2"/>
      <rect x="670" y="355" width="32" height="32" rx="2"/>
      <rect x="720" y="355" width="32" height="32" rx="2"/>
      <rect x="770" y="355" width="32" height="32" rx="2"/>
      
      <!-- Row 3 -->
      <rect x="620" y="410" width="32" height="32" rx="2"/>
      <rect x="670" y="410" width="32" height="32" rx="2"/>
      <rect x="720" y="410" width="32" height="32" rx="2"/>
      <rect x="770" y="410" width="32" height="32" rx="2"/>
      
      <!-- Row 4 -->
      <rect x="620" y="465" width="32" height="32" rx="2"/>
      <rect x="670" y="465" width="32" height="32" rx="2"/>
      <rect x="720" y="465" width="32" height="32" rx="2"/>
      <rect x="770" y="465" width="32" height="32" rx="2"/>
      
      <!-- Row 5 -->
      <rect x="620" y="520" width="32" height="32" rx="2"/>
      <rect x="670" y="520" width="32" height="32" rx="2"/>
      <rect x="720" y="520" width="32" height="32" rx="2"/>
      <rect x="770" y="520" width="32" height="32" rx="2"/>
    </g>

    <!-- Door -->
    <rect x="695" y="530" width="45" height="70" fill="#8B4513" stroke="#654321" stroke-width="2" rx="3"/>
    <circle cx="735" cy="565" r="3" fill="#FFD700"/>

    <!-- Roof -->
    <polygon points="600,280 730,220 860,280" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
  </g>

  <!-- Left small building -->
  <g id="left-building">
    <!-- Building base -->
    <rect x="50" y="420" width="200" height="180" fill="#E8E8E8" stroke="#999" stroke-width="2"/>
    
    <!-- Windows -->
    <g stroke="#333" stroke-width="1.5" fill="#87CEEB">
      <!-- Row 1 -->
      <rect x="70" y="440" width="28" height="28" rx="2"/>
      <rect x="115" y="440" width="28" height="28" rx="2"/>
      <rect x="160" y="440" width="28" height="28" rx="2"/>
      
      <!-- Row 2 -->
      <rect x="70" y="485" width="28" height="28" rx="2"/>
      <rect x="115" y="485" width="28" height="28" rx="2"/>
      <rect x="160" y="485" width="28" height="28" rx="2"/>
      
      <!-- Row 3 -->
      <rect x="70" y="530" width="28" height="28" rx="2"/>
      <rect x="115" y="530" width="28" height="28" rx="2"/>
      <rect x="160" y="530" width="28" height="28" rx="2"/>
    </g>

    <!-- Door -->
    <rect x="110" y="525" width="38" height="75" fill="#8B4513" stroke="#654321" stroke-width="2" rx="2"/>
    
    <!-- Roof -->
    <polygon points="50,420 150,370 250,420" fill="#C62828" stroke="#A01A1A" stroke-width="2"/>
  </g>

  <!-- Right small building -->
  <g id="right-small-building">
    <!-- Building base -->
    <rect x="950" y="450" width="180" height="150" fill="#F5F5F5" stroke="#999" stroke-width="2"/>
    
    <!-- Windows -->
    <g stroke="#333" stroke-width="1.5" fill="#87CEEB">
      <!-- Row 1 -->
      <rect x="970" y="470" width="26" height="26" rx="2"/>
      <rect x="1015" y="470" width="26" height="26" rx="2"/>
      <rect x="1060" y="470" width="26" height="26" rx="2"/>
      
      <!-- Row 2 -->
      <rect x="970" y="515" width="26" height="26" rx="2"/>
      <rect x="1015" y="515" width="26" height="26" rx="2"/>
      <rect x="1060" y="515" width="26" height="26" rx="2"/>
    </g>

    <!-- Door -->
    <rect x="1005" y="520" width="35" height="80" fill="#8B4513" stroke="#654321" stroke-width="2" rx="2"/>
    
    <!-- Roof -->
    <polygon points="950,450 1040,400 1130,450" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
  </g>

  <!-- Trees/Vegetation -->
  <circle cx="450" cy="580" r="35" fill="#2D5016"/>
  <circle cx="480" cy="560" r="40" fill="#3A6B1F"/>
  <circle cx="420" cy="570" r="30" fill="#2D5016"/>
  <rect x="450" y="610" width="8" height="40" fill="#8B7355"/>

  <circle cx="800" cy="610" r="30" fill="#2D5016"/>
  <circle cx="830" cy="595" r="35" fill="#3A6B1F"/>
  <circle cx="770" cy="605" r="28" fill="#2D5016"/>
  <rect x="800" y="635" width="7" height="35" fill="#8B7355"/>

  <!-- Decorative fence/border -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#666" stroke-width="2" opacity="0.3"/>
</svg>